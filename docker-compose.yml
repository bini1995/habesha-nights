services:
  opportunity-agent:
    build: .
    container_name: nyc-opportunity-agent
    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env

    volumes:
      - ./logs:/app/logs

    environment:
      NODE_ENV: production
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:3000"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
